[glyph_base]
extends = arduino_pico_base
upload_protocol = cmsis-dap
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/${PIOENV}/include
    -D SSD1306_NO_SPLASH
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/${PIOENV}>
lib_ignore =
    ${env.lib_ignore}
    https://github.com/JonnyHaystack/HayBox-proto
lib_deps =
    ${arduino_pico_base.lib_deps}
    https://github.com/GregTurbo/HayBox-proto#db4e2f6

[env:glyph_protoA]
extends = glyph_base

[env:glyph_mk6_Debug]
extends = glyph_base
build_unflags = 
    -O3
    -NDEBUG
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/glyph_mk6/include
    -D SSD1306_NO_SPLASH
    -Og
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/$glyph_mk6>

[env:glyph_mk6]
extends = glyph_base

[env:glyph_mk6_usb_host]
extends = glyph_base
custom_enable_usb_host = true
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/glyph_mk6/include
    -D SSD1306_NO_SPLASH
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/glyph_mk6>
